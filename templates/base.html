<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Raj Tours &amp; Travels | Travel Agency in Kalyan, Maharashtra{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Raj Tours &amp; Travels is a tour and travel agency in Kalyan, Maharashtra offering domestic and international tour packages, group departures, family holidays, honeymoon trips and customized tours.{% endblock %}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{% block canonical %}{{ request.base_url }}{% endblock %}">
  <meta name="theme-color" content="#0c1a2e">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Raj Tours &amp; Travels">
  <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ self.meta_description() }}{% endblock %}">
  <meta property="og:url" content="{{ request.base_url }}">
  <meta property="og:image" content="{% block og_image %}{{ url_for('static', filename='images/see-the-magic/kashmir.webp', _external=True) }}{% endblock %}">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Structured data: TravelAgency (facts from this site only) -->
  {% block structured_data %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TravelAgency",
    "name": "Raj Tours & Travels",
    "url": {{ request.url_root | tojson }},
    "description": "Raj Tours & Travels is a tour and travel agency in Kalyan, Maharashtra offering domestic and international tour packages, group departures, family holidays, honeymoon trips and customized tours.",
    "telephone": "+918450982772",
    "email": "rajtoursandtravels009@gmail.com",
    "image": {{ url_for('static', filename='images/see-the-magic/kashmir.webp', _external=True) | tojson }},
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Shop No. 05, First Floor, Vishnu Heights, Patil Nagar, near Ambivali Station West",
      "addressLocality": "Kalyan",
      "addressRegion": "Maharashtra",
      "addressCountry": "IN"
    },
    "areaServed": [
      { "@type": "City", "name": "Kalyan" },
      { "@type": "City", "name": "Dombivli" },
      { "@type": "City", "name": "Thane" },
      { "@type": "City", "name": "Mumbai" }
    ]
  }
  </script>
  {% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:wght@300;400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicons/raj-mark.svg') }}">
  <link rel="manifest" href="{{ url_for('static', filename='images/favicons/site.webmanifest') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicons/raj-mark.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>


  {% include 'components/navbar.html' %}

  {% block content %}{% endblock %}

  {% include 'components/footer.html' %}

  {% block scripts %}
  <script>
    // ================= NAVBAR SCROLL =================
    const navbar = document.getElementById("navbar");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 60) {
        navbar.classList.add("scrolled");
      } else {
        navbar.classList.remove("scrolled");
      }
    });

    // ================= MOBILE MENU =================
    const mobileMenu = document.getElementById("mobileMenu");
    const hamburger = document.getElementById("hamburger");
    const closeBtn = document.querySelector(".mobile-close");

    // OPEN MENU
    function openMenu() {
      mobileMenu.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    // CLOSE MENU
    function closeMenu() {
      mobileMenu.classList.remove("open");
      document.body.style.overflow = "";
    }

    // EVENTS
    hamburger.addEventListener("click", openMenu);
    closeBtn.addEventListener("click", closeMenu);

    // CLOSE ON OUTSIDE CLICK
    mobileMenu.addEventListener("click", (e) => {
      if (e.target === mobileMenu) {
        closeMenu();
      }
    });

    // CLOSE ON ESC KEY
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeMenu();
      }
    });
    
    // Scroll reveal
    const revealEls = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    revealEls.forEach(el => observer.observe(el));

    // Form submit
    function handleSubmit(btn) {
      btn.textContent = 'Enquiry Sent — We\'ll Call You Soon';
      btn.style.background = 'var(--mint)';
      setTimeout(() => { btn.textContent = 'Send Enquiry'; btn.style.background = ''; }, 4000);
    }

    // Hero slider
    const heroSlides = document.querySelectorAll('.hero-slide');
    if (heroSlides.length > 0) {
      let current = 0;
      setInterval(() => {
        heroSlides[current].classList.remove('active');
        current = (current + 1) % heroSlides.length;
        heroSlides[current].classList.add('active');
      }, 4500);
    }


  </script>


  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  {% endblock %}
</body>

</html>
